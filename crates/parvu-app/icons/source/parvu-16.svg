    <rect x="7" y="3" width="2" height="2"/>
    <rect x="7" y="11" width="2" height="2"/>
    <rect x="11" y="3" width="2" height="6"/>
    <rect x="11" y="10" width="2" height="3"/>
  </g>
  <rect x="7" y="6" width="2" height="4" fill="#FFC66B"/>
</svg>
