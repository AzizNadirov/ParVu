[package]
name = "parvu-app"
description = "ParVu - Parquet, CSV, JSON and Excel viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "parvu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
parvu-core = { workspace = true, features = ["schema"] }
parvu-dsl.workspace = true
parvu-config.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
dirs.workspace = true
schemars.workspace = true
# MCP server (`parvu mcp`, src/mcp.rs).
rmcp = { version = "3.10", default-features = false, features = ["server", "client", "macros", "transport-io"] }
# Built-in AI assistant (src/ai_assistant.rs).
parvu-ai.workspace = true
keyring = "4.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
getrandom = "0.3"

# Memory guard (src/memguard.rs): this process's memory use.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Tray icon (src/tray.rs): whether the appindicator library loads and a
# StatusNotifier host (the top bar) is there. Both already come with Tauri.
[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"  # the title bar fix in main.rs (`let_title_bar_buttons_click`); comes with Tauri
libloading = "0.7"

[features]
default = []
# Link DuckDB statically, compiled from source (installers; see build.sh).
# Without it the app links the official prebuilt DuckDB library, which is
# fine for development but must not be shipped.
bundled-duckdb = ["parvu-core/bundled"]
# Set by the Tauri CLI for release builds (serve the embedded UI).
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile.workspace = true
