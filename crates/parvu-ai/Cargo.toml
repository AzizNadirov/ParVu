[package]
name = "parvu-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ParVu's AI assistant: model providers, the agent loop and pricing (no DuckDB, no Tauri)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
eventsource-stream = "0.2"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
