[package]
name = "parvu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bundled"]
# Compile DuckDB from source and link it statically (release builds).
# Without it, the DuckDB crate downloads the official prebuilt library,
# which CI uses for fast test runs.
bundled = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]

[dependencies]
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true
chrono.workspace = true
regex.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
