name: CI

on:
  push:
    branches: [main, "rust-*"]
  pull_request:
  workflow_dispatch:
  # release.yml runs the tests through this workflow.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI checks
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test
          npm --prefix ui run build
      # These use the prebuilt DuckDB library; installers below compile
      # DuckDB in (build.sh enables the bundled-duckdb feature).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p parvu-core -p parvu-dsl -p parvu-config

  # Installers take the longest (DuckDB is compiled from source), so they
  # are built only for main and manual runs. Version tags are built and
  # published by release.yml.
  package:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/package.yml
