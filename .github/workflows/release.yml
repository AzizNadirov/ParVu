name: Release

# Pushing a tag such as v1.0.0 or v1.0.0-alpha.1 tests, builds both
# installers and publishes them as a GitHub release. Versions with a "-"
# are marked as pre-releases. The notes come from that version's section in
# CHANGELOG.md, followed by SHA-256 checksums.
#
# To retry a release with the current version of this workflow (re-running a
# failed run uses the workflow file of the tagged commit), start it by hand:
#   gh workflow run Release -f tag=v1.0.0-alpha.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches the app version
        run: |
          tag="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tauri_version=$(jq -r .version crates/parvu-app/tauri.conf.json)
          ui_version=$(jq -r .version ui/package.json)
          echo "tag $tag, Cargo.toml $cargo_version, tauri.conf.json $tauri_version, ui/package.json $ui_version"
          for v in "$cargo_version" "$tauri_version" "$ui_version"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::Tag v$tag does not match the version $v in the repository. Update the versions, commit, and tag that commit."
              exit 1
            fi
          done

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ needs.check-version.outputs.tag }}

  package:
    needs: [check-version, test]
    uses: ./.github/workflows/package.yml
    with:
      ref: refs/tags/${{ needs.check-version.outputs.tag }}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the installers
        run: |
          # Artifacts keep their bundle folders (deb/, nsis/); release files are flat.
          mkdir dist
          find artifacts -type f \( -name '*.deb' -o -name '*.exe' \) -exec mv -t dist {} +
          # GitHub may rewrite "~" in asset names; the deb's own version keeps it.
          for f in dist/*~*; do if [ -e "$f" ]; then mv "$f" "${f//\~/-}"; fi; done
          ls -l dist
          ls dist/*.deb dist/*.exe >/dev/null
      - name: Release notes
        run: |
          version="${TAG#v}"
          # The section "## [<version>]" up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          # Install instructions with this release's file names, above the changelog.
          deb=$(cd dist && ls -- *.deb | head -1)
          exe=$(cd dist && ls -- *.exe | head -1)
          {
            echo "## Install"
            echo
            echo "**Ubuntu / Debian** (64-bit):"
            echo '```bash'
            echo "sudo apt install ./$deb"
            echo '```'
            echo "or download, verify and install in one step:"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash -s -- --prebuilt"
            echo '```'
            echo
            echo "**Windows 10/11** (64-bit): run \`$exe\`. The installer isn't code-signed yet: choose *More info → Run anyway*."
            echo
            echo "## Changes"
            echo
            sed 's/^### /#### /' notes.md
          } > notes.full.md
          mv notes.full.md notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "Installation and troubleshooting: [RELEASES.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/RELEASES.md)."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r sum file; do echo "| \`$file\` | \`$sum\` |"; done < dist/SHA256SUMS.txt
          } >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions with a "-" (1.1.0-beta.1) are pre-releases once a stable
          # 1.x or later release exists. Until then the newest alpha/beta is
          # the Latest release, so the page doesn't point at the 0.x Python app.
          flags=(--latest)
          if [[ "$TAG" == *-* ]] && gh release list --exclude-pre-releases --limit 100 --json tagName -q '.[].tagName' \
               | grep -Eq '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            flags=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run replaces the files of the existing release.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "ParVu ${TAG#v}" --notes-file notes.md "${flags[@]}"
          fi
