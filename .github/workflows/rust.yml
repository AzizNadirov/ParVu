name: CI

on:
  push:
    branches: [main, "rust-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          uv sync --extra dev
          uv run pytest tests/unit/ -q

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI checks
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui test
          npm --prefix ui run build
      # The prebuilt DuckDB library avoids compiling DuckDB from C++ here.
      # Installers below still link DuckDB statically.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test -p parvu-core -p parvu-dsl -p parvu-config --no-default-features

  # Installers take the longest (DuckDB is compiled from source), so they
  # are built only for main, version tags and manual runs.
  package:
    needs: [test, python]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        shell: bash
        run: ./build-rust.sh
      - name: Smoke test on a clean home directory
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          sudo dpkg -i target/release/bundle/deb/*.deb
          export HOME=$(mktemp -d)
          timeout 15 xvfb-run -a parvu-next || code=$?
          # 124 = still running when the timeout fired, which means it started.
          test "${code:-124}" = 124
          test -f "$HOME/.ParVu/settings/settings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parvu-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
