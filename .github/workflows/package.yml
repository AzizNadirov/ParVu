name: Package

# Builds the Linux deb and the Windows installer, smoke-tests the deb, and
# uploads both as the artifacts "parvu-<os>". Called by ci.yml and release.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build (default: the triggering commit)"
        type: string
        default: ""

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The prebuilt DuckDB library is downloaded next to the profile
          # folders, which rust-cache does not save by default; without it a
          # restored (fresh) libduckdb-sys build links a missing duckdb.lib.
          prefix-key: v1-duckdb
          cache-directories: target/duckdb-download
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        shell: bash
        run: ./build.sh
      - name: Smoke test on a clean home directory
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          sudo dpkg -i target/release/bundle/deb/*.deb
          export HOME=$(mktemp -d)
          timeout 15 xvfb-run -a parvu || code=$?
          # 124 = still running when the timeout fired, which means it started.
          test "${code:-124}" = 124
          test -f "$HOME/.ParVu/settings/settings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parvu-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
