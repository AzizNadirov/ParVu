[project]
name = "ParVu"
version = "0.3.0"
description = "ParVu - Parquet/CSV/JSON File Viewer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types>=0.7.0",
    "duckdb>=1.4.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyqt6>=6.6.0",
    "python-dateutil>=2.9.0.post0",
    "loguru>=0.7.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11.1",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.2.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
parvu = "parvu.__main__:main"

[project.gui-scripts]
parvu-gui = "parvu.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parvu"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
